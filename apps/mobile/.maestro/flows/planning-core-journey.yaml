# Destination + fixed-cost write/read-back journey (SPEC-023).
appId: dev.matthewcarr.travelplanner
---
- launchApp
- runFlow:
    when:
      visible:
        id: 'login-screen-root'
    commands:
      - tapOn:
          id: 'login-google-button'
- extendedWaitUntil:
    visible:
      id: 'trips-screen-root'
    timeout: 60000
- tapOn:
    id: 'trips-screen-item-b0000000-0e2e-4000-8000-000000000001'
- scrollUntilVisible:
    element:
      id: 'trip-detail-add-destination'
    direction: DOWN
- tapOn:
    id: 'trip-detail-add-destination'
- extendedWaitUntil:
    visible:
      id: 'destination-editor-root'
    timeout: 30000
- tapOn:
    id: 'destination-name'
- inputText: 'Mobile Planning Stop'
- tapOn:
    id: 'destination-country'
- inputText: 'Japan'
- tapOn:
    id: 'destination-country-JPN'
- swipe:
    direction: UP
    duration: 400
- scrollUntilVisible:
    element:
      id: 'destination-start-date'
    direction: DOWN
- tapOn:
    id: 'destination-start-date'
- inputText: '2027-04-01'
- swipe:
    direction: UP
    duration: 400
- scrollUntilVisible:
    element:
      id: 'destination-end-date'
    direction: DOWN
- tapOn:
    id: 'destination-end-date'
- inputText: '2027-04-08'
- swipe:
    direction: UP
    duration: 400
- scrollUntilVisible:
    element:
      id: 'destination-submit'
    direction: DOWN
- tapOn:
    id: 'destination-submit'
- extendedWaitUntil:
    visible:
      id: 'trip-detail-root'
    timeout: 30000
- scrollUntilVisible:
    element: 'Mobile Planning Stop'
    direction: DOWN
- assertVisible: 'Mobile Planning Stop'
- tapOn: 'Mobile Planning Stop'
- tapOn:
    id: 'destination-name'
- eraseText
- inputText: 'Mobile Planning Updated'
- swipe:
    direction: UP
    duration: 400
- scrollUntilVisible:
    element:
      id: 'destination-submit'
    direction: DOWN
- tapOn:
    id: 'destination-submit'
- extendedWaitUntil:
    visible:
      id: 'trip-detail-root'
    timeout: 30000
- assertVisible: 'Mobile Planning Updated'
- scrollUntilVisible:
    element:
      id: 'trip-detail-add-fixed-cost'
    direction: DOWN
- tapOn:
    id: 'trip-detail-add-fixed-cost'
- tapOn:
    id: 'fixed-cost-label'
- inputText: 'Mobile Rail Pass'
- tapOn:
    id: 'fixed-cost-amount'
- inputText: '250'
- swipe:
    direction: UP
    duration: 400
- scrollUntilVisible:
    element:
      id: 'fixed-cost-category-transport'
    direction: DOWN
- tapOn:
    id: 'fixed-cost-category-transport'
- scrollUntilVisible:
    element:
      id: 'fixed-cost-submit'
    direction: DOWN
- tapOn:
    id: 'fixed-cost-submit'
- extendedWaitUntil:
    visible:
      id: 'trip-detail-root'
    timeout: 30000
- assertVisible: 'Mobile Rail Pass'
- tapOn: 'Mobile Rail Pass'
- tapOn:
    id: 'fixed-cost-label'
- eraseText
- inputText: 'Mobile Rail Updated'
- swipe:
    direction: UP
    duration: 400
- scrollUntilVisible:
    element:
      id: 'fixed-cost-submit'
    direction: DOWN
- tapOn:
    id: 'fixed-cost-submit'
- extendedWaitUntil:
    visible:
      id: 'trip-detail-root'
    timeout: 30000
- assertVisible: 'Mobile Rail Updated'
- tapOn: 'Mobile Rail Updated'
- tapOn:
    id: 'fixed-cost-delete'
- tapOn:
    id: 'fixed-cost-delete-confirm'
- extendedWaitUntil:
    visible:
      id: 'trip-detail-root'
    timeout: 30000
- scrollUntilVisible:
    element: 'Mobile Planning Updated'
    direction: UP
- tapOn: 'Mobile Planning Updated'
- tapOn:
    id: 'destination-delete'
- tapOn:
    id: 'destination-delete-confirm'
- extendedWaitUntil:
    visible:
      id: 'trip-detail-root'
    timeout: 30000
- assertNotVisible: 'Mobile Planning Updated'
