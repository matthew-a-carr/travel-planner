name: Infra Validate

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'apps/web/drizzle/**'
      - 'apps/web/scripts/check-migrations-transactional.ts'
      - 'apps/web/src/infrastructure/db/migrate-deploy.ts'
      - '.github/workflows/infra-*.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'apps/web/drizzle/**'
      - 'apps/web/scripts/check-migrations-transactional.ts'
      - 'apps/web/src/infrastructure/db/migrate-deploy.ts'
      - '.github/workflows/infra-*.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform + migration policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.12.2

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check migration transactional safety
        run: pnpm db:check:migrations

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra

      - name: Validate prod stack
        run: |
          terraform -chdir=infra/stacks/prod init -backend=false -input=false
          terraform -chdir=infra/stacks/prod validate

      - name: Validate preview stack
        run: |
          terraform -chdir=infra/stacks/preview init -backend=false -input=false
          terraform -chdir=infra/stacks/preview validate

      - name: Test preview cleanup with mocked providers
        run: terraform -chdir=infra/stacks/preview test
